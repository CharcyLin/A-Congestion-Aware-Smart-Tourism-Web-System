name: Collect derived LSTM forecasts

on:
  schedule:
    # Two snapshots per hour. Avoid minute zero, when scheduled Actions are
    # more likely to be delayed. Every run rebuilds from current observations.
    - cron: "9,39 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: derived-lstm-forecasts
  cancel-in-progress: false

jobs:
  forecast:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: model_service/requirements.txt
      - run: python -m pip install -r model_service/requirements.txt
      - name: Generate and publish model predictions
        working-directory: model_service
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python collect_derived_forecasts.py
